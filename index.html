<script>
/* Diagnóstico: si algo falla al arrancar, se muestra el error en pantalla en lugar de dejarla en blanco */
(function(){var V='v11';function show(m){try{var d=document.getElementById('diag');if(!d){d=document.createElement('div');d.id='diag';
d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;background:#7f1d1d;color:#fff;padding:12px;border-radius:12px;font:13px/1.4 system-ui;white-space:pre-wrap;word-break:break-word';
(document.body||document.documentElement).appendChild(d);}d.textContent=(d.textContent||'Error en la app ('+V+'). Hazme una captura de este mensaje:')+'\n• '+m;}catch(e){}}
window.addEventListener('error',function(e){show((e.message||'error')+' @ línea '+(e.lineno||'?')+':'+(e.colno||'?')+(e.error&&e.error.stack?' | '+String(e.error.stack).split('\n').slice(0,3).join(' / '):''));});
window.addEventListener('unhandledrejection',function(e){show('promesa: '+(e.reason&&e.reason.message||e.reason));});
window.addEventListener('load',function(){setTimeout(function(){var v=document.getElementById('view');if((!v||!v.innerHTML.trim())&&!document.getElementById('diag'))show('La pantalla no se ha pintado (sin error de JS).');},1500);});})();
</script>
<script>
/* Aplica el tema guardado antes de pintar para evitar el parpadeo */
try{var s=JSON.parse(localStorage.getItem('kcal-macros-v1')||'{}');var t=s.theme||'auto';
if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
document.documentElement.dataset.theme=t;}catch(e){}
</script>
<style>
/* ===== Tema (variables) ===== */
:root{
  --bg:#0f1115; --card:#181b22; --card2:#20242d; --text:#e8eaf0; --muted:#98a0b3;
  --line:#2a2f3b; --accent:#4ade80; --accent-ink:#06210f; --danger:#f87171;
  --warn:#fbbf24; --blue:#60a5fa; --violet:#c084fc;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f4f7; --card:#ffffff; --card2:#eef0f4; --text:#1b1f27; --muted:#5d667a;
  --line:#dde1e9; --accent:#16a34a; --accent-ink:#ffffff; --danger:#dc2626;
  --warn:#d97706; --blue:#2563eb; --violet:#7c3aed;
  color-scheme:light;
}

/* ===== Base ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:0}
h3{margin:0 0 6px;font-size:18px}
.sub{display:block;color:var(--muted);font-size:13px}
.center{text-align:center;margin:0 12px 12px}
.grow{flex:1;min-width:0}
b{font-weight:650}

#topbar{position:sticky;top:0;z-index:10;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
#topbar button{min-height:44px;min-width:44px;font-size:20px;border:0;background:var(--card);
  color:var(--text);border-radius:12px}

/* ===== Tarjetas, botones, campos ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 12px 12px}
.card h2{margin:0 0 8px;font-size:16px}
#topbar button.inst{font-size:13px;font-weight:600;padding:0 12px;background:var(--accent);color:var(--accent-ink);border-radius:12px;margin-left:auto;margin-right:8px}
#topbar button.inst[hidden]{display:none}
#welcome{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;padding:max(20px,env(safe-area-inset-top)) 16px 40px}
#welcome .in{max-width:520px;margin:0 auto}
#welcome input,#welcome select{width:100%}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card2);
  color:var(--text);font:inherit;font-weight:600;padding:0 16px;cursor:pointer}
.btn:active{filter:brightness(.9)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.block{width:100%;margin-top:10px}
.btn.sm{min-height:42px;padding:0 12px;font-size:14px}
.iconbtn{min-width:52px;min-height:52px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:26px}
input,select,textarea{width:100%;min-height:48px;background:var(--card2);color:var(--text);
  border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit}
textarea{padding:10px 12px;min-height:160px;font-size:14px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0}
.steps{margin:6px 0 8px 20px;padding:0;line-height:1.7}
.lbl{display:block;margin:12px 0 4px;font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.row2 .btn{margin:0}
.check{display:flex;gap:10px;align-items:center;margin:14px 0 4px;font-size:15px}
.check input{width:24px;height:24px;min-height:0;flex:none}
.badge{display:inline-block;background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn);
  border-radius:8px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);
  background:var(--card2);color:var(--text);font:inherit;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.seg{display:flex;gap:6px;background:var(--card2);padding:4px;border-radius:14px;margin:10px 0}
.seg button{flex:1;min-height:42px;border:0;border-radius:10px;background:transparent;color:var(--text);font:inherit;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

/* ===== Listas ===== */
.list{display:flex;flex-direction:column;gap:8px;margin:10px 0;max-height:46vh;overflow:auto}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:56px;
  background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;
  color:var(--text);font:inherit;cursor:pointer}
.item b{display:block}
.entry{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:52px;background:none;
  border:0;border-top:1px solid var(--line);padding:8px 0;color:var(--text);font:inherit;cursor:pointer}
.entry .kc{font-weight:650;white-space:nowrap}

/* ===== Diario ===== */
.datenav{display:flex;gap:8px;align-items:center;padding:0 12px 12px}
.datec{flex:1;text-align:center}
.dlabel{font-weight:650;margin-bottom:4px}
.datec input{text-align:center}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.nums .n{font-size:24px;font-weight:700;line-height:1.1}
.nums .l{font-size:12px;color:var(--muted)}
.bal{margin-top:12px;padding:12px;border-radius:12px;font-weight:650;text-align:center;
  background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.bal.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.bal.danger{background:color-mix(in srgb,var(--danger) 22%,transparent);color:var(--danger)}
.bal.none{background:var(--card2);color:var(--muted);font-weight:500}
.trainrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.switch{position:relative;width:58px;height:34px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;min-height:0;z-index:2;cursor:pointer}
.switch i{position:absolute;inset:0;background:var(--card2);border:1px solid var(--line);border-radius:20px;transition:.15s}
.switch i:after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--muted);transition:.15s}
.switch input:checked+i{background:var(--accent);border-color:transparent}
.switch input:checked+i:after{left:27px;background:var(--accent-ink)}
.mrow{margin:10px 0 0}
.mrow .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.track{height:10px;background:var(--card2);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;background:var(--accent)}
.fill.p{background:var(--blue)} .fill.f{background:var(--warn)} .fill.c{background:var(--violet)} .fill.fi{background:var(--accent)}
.fill.over{background:var(--danger)}
.bhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.bhead .kc{font-size:20px;font-weight:700}
.bactions{display:grid;grid-template-columns:2fr 2fr 1fr;gap:8px;margin-top:8px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper .iconbtn{min-width:56px;min-height:56px}
.stepper .val{font-size:26px;font-weight:700;min-width:36px;text-align:center}
.exrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.exrow .w{color:var(--muted);text-align:right;font-size:13px;flex:none;max-width:45%}
.exhead{margin-top:10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:650;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:after{content:"▾";margin-left:auto;color:var(--muted)}
details[open] summary:after{content:"▴"}
.steps{margin:6px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}
.exrow2{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.row3 .btn{padding:0 6px}
.center .btn{margin:0 4px 6px}
.thumb{width:48px;height:48px;object-fit:contain;border-radius:8px;background:#fff;flex:none}
.kgbox{display:flex;align-items:center;gap:4px;flex:none}
.kgbox input{width:84px;text-align:right}
.kgbox em{font-style:normal;color:var(--muted);font-size:13px}

/* ===== Semana ===== */
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat div{background:var(--card2);border-radius:12px;padding:10px}
.stat .n{font-size:22px;font-weight:700}
.stat .l{font-size:12px;color:var(--muted)}
.stat .danger .n{color:var(--danger)}
.dayrow{padding:10px 0;border-top:1px solid var(--line)}
.dayrow .top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.dayrow .track{margin-top:6px;height:8px}
.dayrow.dim{opacity:.5}

/* ===== Peso ===== */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .line{stroke:var(--accent);fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--accent)}
.chart text{fill:var(--muted);font-size:10px}
.chart text.last{fill:var(--text);font-weight:700;font-size:11px}

/* ===== Ajustes ===== */
.fld{display:flex;align-items:center;gap:10px;margin:8px 0}
.fld span{flex:1;font-size:15px}
.fld input,.fld select{width:130px;text-align:right}
.fld select{text-align:left}
.fld em{font-style:normal;color:var(--muted);width:42px;font-size:13px}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}

/* ===== Barra inferior ===== */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
#tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
#tabs button{min-height:64px;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#tabs button span{font-size:22px;line-height:1}
#tabs button.on{color:var(--accent);font-weight:700}

/* ===== Hoja inferior (diálogos) y aviso ===== */
#sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.55)}
#sheet.open{display:flex;align-items:flex-end;justify-content:center}
#sheetBody{background:var(--card);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;
  border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.preview{margin:8px 0 4px;padding:10px;border-radius:12px;background:var(--card2);font-size:14px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.empty{color:var(--muted);text-align:center;padding:16px 4px}
</style>
</head>

  <header id="topbar"><h1 id="title">Diario</h1><button id="installBtn" class="inst" hidden>⬇ Instalar app</button><button id="themeBtn" aria-label="Cambiar tema">◐</button></header>
  <main id="view"></main>
</div>
<nav id="tabs"><div class="in" id="tabsIn"></div></nav>
<div id="sheet"><div id="sheetBody"></div></div>

<script>
'use strict';
/* =====================================================================
   CALORÍAS Y MACROS · PWA sin dependencias · datos en localStorage
   Secciones: 1 Utilidades · 2 Datos por defecto · 3 Estado y cálculo
              4 Hojas/diálogos · 5 Vistas · 6 Eventos · 7 Arranque
   ===================================================================== */

/* ---------- 1. Utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const clone = o => JSON.parse(JSON.stringify(o));
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); };
const today = () => dkey(new Date());
const mondayOf = k => { const d = parseKey(k); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return dkey(d); };
/* Acepta coma o punto decimal */
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmt = (n, dec = 0) => Number(n || 0).toLocaleString('es-ES', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const plain = n => String(Math.round(n * 100) / 100).replace('.', ',');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const dateLabel = k => {
  const s = parseKey(k).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  return (k === today() ? 'Hoy · ' : '') + cap(s);
};
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ---------- 2. Datos por defecto ---------- */
const MEALS = [
  { id: 'desayuno', name: 'Desayuno', icon: '☕' },
  { id: 'media', name: 'Media mañana', icon: '🍎' },
  { id: 'almuerzo', name: 'Almuerzo', icon: '🍽️' },
  { id: 'cena', name: 'Cena', icon: '🌙' }
];
const KEY = 'kcal-macros-v1';

/* Alimento: valores por 100 g. approx=true → pendiente de corregir con la etiqueta. */
const F = (id, name, kcal, p, f, c, fiber, approx, unit, note) =>
  ({ id, name, kcal, p, f, c, fiber, approx: !!approx, unit: unit || null, note: note || '' });
const SEED_FOODS = [
  F('arroz-basmati', 'Arroz basmati Hacendado cocido', 147, 3.2, 2.7, 27.5, 0.8, true, { name: 'ración', g: 125 },

  F('pavo', 'Pechuga de pavo', 108, 22, 2, 1, 0, true, null, 'Aproximado: ~108 kcal y ~22 g de proteína. Grasa y carbos estimados.'),
  F('queso-fresco', 'Queso fresco', 90, 11, 4, 3.5, 0, true, null, 'Aproximado: ~90 kcal y ~11 g de proteína. Grasa y carbos estimados.'),
  F('huevo', 'Huevo', 125, 10.8, 8.3, 0.7, 0, true, { name: 'pieza', g: 60 }, 'Pieza ~60 g: ~75 kcal y ~6,5 g de proteína.'),
  F('pan-centeno', 'Pan de centeno', 245, 8.5, 1.5, 46, 7, true, { name: 'rebanada', g: 30 }, 'Valores típicos; revisa tu marca.'),
  F('caña-lomo', 'Caña de lomo', 230, 36, 9, 1, 0, true, null, 'Valores típicos; revisa tu marca.'),
  F('aceite-oliva', 'Aceite de oliva', 900, 0, 100, 0, 0, true, { name: 'cucharada', g: 10 }),
  F('yogur-griego', 'Yogur griego', 125, 5.5, 9, 4, 0, true, { name: 'yogur', g: 125 }, 'Valores típicos; revisa tu marca.'),
  F('manzana', 'Manzana', 52, 0.3, 0.2, 13.8, 2.4, true, { name: 'pieza', g: 180 }),
  F('platano', 'Plátano', 90, 1.1, 0.3, 20, 2.6, true, { name: 'pieza', g: 110 }, 'Peso de la pieza ya pelada.'),
  F('cafe-leche', 'Café con leche con azúcar', 33, 1.7, 0.9, 4.9, 0, true, { name: 'taza', g: 200 },

];


/* ---------- Catálogo base offline ----------
   Alimentos genéricos con valores APROXIMADOS por 100 g (tipo tablas de composición; carbohidratos "disponibles",
   sin fibra, como en las etiquetas europeas). No se mezclan con tu base: al buscar aparecen aparte y, al usar uno,
   se copia a tu base marcado como "aprox." para que lo corrijas cuando quieras.
   Formato: [nombre, kcal, proteína, grasa, carbos, fibra, unidad?, gramos de la unidad?] */
const CATALOG = [
  // Carnes y aves

  ['Conejo (crudo)', 135, 21, 5.5, 0, 0], ['Hígado de ternera (crudo)', 135, 20, 3.6, 3.9, 0],
  ['Hamburguesa de ternera (cruda)', 230, 17, 17, 1, 0, 'hamburguesa', 120], ['Salchicha fresca de cerdo (cruda)', 270, 13, 23, 2, 0],
  ['Jamón cocido extra', 105, 17, 3.5, 1, 0, 'loncha', 20], ['Jamón serrano', 250, 31, 14, 0, 0, 'loncha', 15],
  ['Fiambre de pavo', 100, 17, 2, 2, 0, 'loncha', 20], ['Chorizo', 400, 22, 34, 2, 0, 'rodaja', 8],

const catId = name => 'cat-' + norm(name).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
/* Índices del catálogo que encajan con la búsqueda y aún no están en tu base */
function catalogMatches(q, max = 12) {
  const terms = norm(q).split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  const have = new Set(state.foods.map(f => norm(f.name)));
  const out = [];
  for (let i = 0; i < CATALOG.length && out.length < max; i++) {
    const n = norm(CATALOG[i][0]);
    if (terms.every(t => n.includes(t)) && !have.has(n) && !foodById(catId(CATALOG[i][0]))) out.push(i);
  }
  return out;
}
/* Copia un alimento del catálogo a tu base (marcado como aproximado) y lo devuelve */
function addCatalog(i) {
  const c = CATALOG[i], id = catId(c[0]);
  let f = foodById(id);
  if (!f) {
    f = { id, name: c[0], kcal: c[1], p: c[2], f: c[3], c: c[4], fiber: c[5], approx: true,
          note: 'Catálogo base: valor aproximado de tablas de composición. Revísalo con tu etiqueta.',
          unit: c[6] ? { name: c[6], g: c[7] } : null };
    state.foods.push(f); save();
  }
  return f;
}
function catalogSectionHTML(q) {
  const idx = catalogMatches(q, 12);
  if (!idx.length) return '';
  return '<h2 style="margin-top:14px">Catálogo base</h2>' + idx.map(i => { const c = CATALOG[i];
    return `<button class="entry" data-a="catAdd" data-i="${i}"><span class="grow"><b>${esc(c[0])}</b>
      <span class="sub">${fmt(c[1])} kcal · P ${fmt(c[2], 1)} · G ${fmt(c[3], 1)} · C ${fmt(c[4], 1)} /100 g</span></span><span class="badge">＋ añadir</span></button>`; }).join('');
}

/* Convierte el formato antiguo de rutinas (una por día de la semana) al nuevo */
function migrateRoutines(old) {
  return Object.keys(old).map(k => {
    const o = old[k], rows = o.rows || [], cardio = rows.find(x => x[0] === 'Cardio'), id = 'rut-' + k;
    return { id, name: o.title || 'Rutina', dows: [+k], strengthMin: 45, met: 5, cardioMin: cardio ? num(cardio[2]) : 0, cardioSpeed: 8,
      rows: rows.filter(x => x[0] !== 'Cardio').map((r, i) => ({ id: `${id}-${i}`, block: r[0] || '', name: r[1] || '', sets: r[2] || '', plan: r[3] || '' })) };
  });
}
function normalize(s) {
  const d = defaults(), sp = s.profile || {};
  const out = Object.assign({}, d, s);
  out.profile = Object.assign({}, d.profile, sp);
  out.profile.gym = Object.assign({}, d.profile.gym, sp.gym || {});
  out.profile.targets = Object.assign({}, d.profile.targets, sp.targets || {});
  ['foods', 'meals', 'weights', 'recent'].forEach(k => { if (!Array.isArray(out[k])) out[k] = d[k]; });
  ['days', 'lastGrams'].forEach(k => { if (!out[k] || typeof out[k] !== 'object') out[k] = d[k]; });
  out.foods = out.foods.filter(f => f && f.id && f.name).map(f => ({
    id: String(f.id), name: String(f.name), kcal: num(f.kcal), p: num(f.p), f: num(f.f), c: num(f.c), fiber: num(f.fiber),
    approx: !!f.approx, note: f.note || '',
    unit: f.unit && f.unit.name && num(f.unit.g) > 0 ? { name: String(f.unit.name), g: num(f.unit.g) } : null
  }));
  // Rutinas: si vienen del formato antiguo se migran; si no hay ninguna, las de serie
  if (!Array.isArray(s.routines)) out.routines = s.routine && typeof s.routine === 'object' ? migrateRoutines(s.routine) : clone(SEED_ROUTINES);
  delete out.routine;

function load() {

let state = load();

const ZERO = () => ({ kcal: 0, p: 0, f: 0, c: 0, fiber: 0 });

const foodById = id => state.foods.find(f => f.id === id);

const foodOf = e => foodById(e.foodId) || e.snap || null;
function macrosOf(e) {
  const f = foodOf(e); if (!f) return ZERO();
  const k = e.grams / 100;
  return { kcal: f.kcal * k, p: f.p * k, f: f.f * k, c: f.c * k, fiber: f.fiber * k };
}
function ensureDay(key) {
  if (!state.days[key]) state.days[key] = { train: false, alcohol: 0, entries: {} };
  const d = state.days[key];
  if (!d.entries) d.entries = {};
  return d;
}
/* Totales de un día: por comida y total (el total incluye las kcal del alcohol) */
function dayTotals(key) {
  const d = state.days[key], meals = {}, total = ZERO();
  MEALS.forEach(m => {
    const t = ZERO();
    ((d && d.entries && d.entries[m.id]) || []).forEach(e => addTo(t, macrosOf(e)));
    meals[m.id] = t; addTo(total, t);

/* Peso vigente en una fecha: último registro anterior o igual; si no hay, el del perfil */
function weightAt(key) {

  return best ? best.kg : state.profile.weight;
}
/* Perfil vigente en una fecha (sexo, edad, altura, factor de actividad).
   Cada cambio se guarda con su fecha y solo afecta de ese día en adelante. */
function profileAt(key) {

/* Metabolismo basal con Mifflin-St Jeor, con el perfil vigente ese día */

/* Edad en una fecha: años cumplidos según la fecha de nacimiento (si no hay, la edad escrita a mano) */

  const [by, bm, bd] = b.split('-').map(Number), [y, m, d] = key.split('-').map(Number);
  return Math.max(0, y - by - ((m < bm || (m === bm && d < bd)) ? 1 : 0));

/* MET de caminar/correr según velocidad (km/h), interpolado de la tabla del Compendium of Physical Activities (aprox.) */
const WALK_MET = [[0, 2.0], [3.2, 2.8], [4.0, 3.0], [4.8, 3.5], [5.6, 4.3], [6.4, 5.0], [7.2, 7.0], [8.0, 8.3],

  const t = WALK_MET;

/* Sesión del día: se crea al activar "Hoy entreno" con la rutina propuesta para ese día de la semana */
function ensureSession(key) {
  const d = ensureDay(key);

  if (!d.session.kg) d.session.kg = {};

}
/* Últimos kilos anotados para un ejercicio de una rutina, antes de la fecha dada */
function priorSessions(routineId, key) {
  return Object.keys(state.days).filter(k => k < key && state.days[k].session && state.days[k].session.routineId === routineId).sort().reverse();
}
function lastKg(routineId, rowId, key) {
  for (const k of priorSessions(routineId, key)) { const v = (state.days[k].session.kg || {})[rowId]; if (v) return v; }

/* Gasto del entrenamiento (fuerza + cinta). Si había "hoy entreno" sin sesión (datos antiguos), se usa el valor fijo de antes. */
function trainParts(key) {
  const d = state.days[key], z = { strength: 0, cardio: 0, total: 0, legacy: false };
  if (!d || !d.train) return z;
  if (!d.session) { const g = num(state.profile.gym[parseKey(key).getDay()]); return { strength: g, cardio: 0, total: g, legacy: true }; }
  const kg = weightAt(key), s = d.session;
  const strength = netKcal(num(s.met) || 5, kg, num(s.strengthMin)), cardio = netKcal(metWalk(num(s.cardioSpeed)), kg, num(s.cardioMin));

function expenseOf(key) {

  if (deficit > alarm) return { cls: 'danger', txt: `Déficit de ${fmt(deficit)} kcal · supera el límite de ${fmt(alarm)}`, bal, intake, ex };
  if (bal > 0) return { cls: 'warn', txt: `Superávit de ${fmt(bal)} kcal`, bal, intake, ex };

    id: uid(), foodId: food.id, grams,

const multBar = () => `<div class="chips" id="mchips">${MULTS.map(v => `<button class="chip ${v === 1 ? 'on' : ''}" data-v="${v}">${v === 0.5 ? '½' : v === 1.5 ? '1½' : v}×</button>`).join('')}</div>`;

/* Cantidad: gramos o unidades (pieza/ración) con vista previa de macros */
function sheetQty({ food, grams, confirmLabel, onOk, onBack, onDelete }) {
  const u = food.unit;
  const isMult = u && u.g > 0 && Math.abs(grams / u.g * 2 - Math.round(grams / u.g * 2)) < 1e-6;
  let mode = isMult ? 'u' : 'g';
  const b = openSheet(`<h3>${esc(food.name)}</h3>
    <span class="sub">${fmt(food.kcal)} kcal / 100 g${food.approx ? ' · valores aproximados' : ''}</span>
    ${u ? `<div class="seg"><button data-m="g">Gramos</button><button data-m="u">${esc(cap(u.name))} (${fmt(u.g)} g)</button></div>` : ''}
    <label class="lbl" id="qlabel"></label>
    <input id="qin" type="text" inputmode="decimal" autocomplete="off">
    <div class="chips" id="qchips"></div>
    <div class="preview" id="qprev"></div>
    <button class="btn primary block" id="qok">${esc(confirmLabel)}</button>
    <div class="row2">
      ${onBack ? '<button class="btn" id="qback">Volver</button>' : '<button class="btn" id="qcancel">Cancelar</button>'}
      ${onDelete ? '<button class="btn danger" id="qdel">Eliminar</button>' : '<span></span>'}
    </div>`);
  const inp = $('#qin', b);
  const toGrams = () => mode === 'u' ? num(inp.value) * u.g : num(inp.value);
  const refresh = () => {
    $('#qlabel', b).textContent = mode === 'u' ? `Número de ${u.name}` : 'Gramos';
    b.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x.dataset.m === mode));
    const vals = mode === 'u' ? [0.5, 1, 2, 3] : [50, 100, 150, 200, 250];
    $('#qchips', b).innerHTML = vals.map(v => `<button class="chip" data-v="${v}">${plain(v)}${mode === 'u' ? '' : ' g'}</button>`).join('');
    preview();
  };
  const preview = () => {
    const g = toGrams(), k = g / 100;
    $('#qprev', b).innerHTML = g > 0
      ? `<b>${fmt(food.kcal * k)} kcal</b> · P ${fmt(food.p * k, 1)} · G ${fmt(food.f * k, 1)} · C ${fmt(food.c * k, 1)} · Fibra ${fmt(food.fiber * k, 1)}${mode === 'u' ? ` · ${fmt(g)} g` : ''}`
      : 'Indica una cantidad';
  };
  inp.value = plain(mode === 'u' ? grams / u.g : grams);
  inp.addEventListener('input', preview);
  b.addEventListener('click', ev => {
    const m = ev.target.closest('[data-m]');
    if (m && m.dataset.m !== mode) { const g = toGrams(); mode = m.dataset.m; inp.value = plain(mode === 'u' ? g / u.g : g); refresh(); }
    const c = ev.target.closest('.chip');

  });

  if (onBack) $('#qback', b).onclick = onBack; else $('#qcancel', b).onclick = closeSheet;
  if (onDelete) $('#qdel', b).onclick = onDelete;
  refresh();
}

/* Buscador de alimentos → cantidad → onPick(food, gramos) */
function sheetPicker({ title, onPick, onBack }) {
  const b = openSheet(`<h3>${esc(title)}</h3>
    <input type="search" id="pq" placeholder="Buscar alimento…" autocomplete="off">
    <div id="plist" class="list"></div>
    <div class="row3"><button class="btn sm" id="pnew">＋ Nuevo</button>
    <button class="btn sm" id="ponline">🌐 Online</button><button class="btn sm" id="pscan">📷 Escanear</button></div>
    <button class="btn block" id="pback">${onBack ? 'Volver' : 'Cerrar'}</button>`);
  const q = $('#pq', b), list = $('#plist', b);
  const rank = id => { const i = state.recent.indexOf(id); return i < 0 ? 999 : i; };
  const draw = () => {
    const t = norm(q.value.trim());
    let arr = state.foods.filter(f => !t || norm(f.name).includes(t));
    arr.sort((a, c) => (t ? 0 : rank(a.id) - rank(c.id)) || a.name.localeCompare(c.name, 'es'));
    let html = arr.map(f => `<button class="item" data-id="${esc(f.id)}"><span class="grow"><b>${esc(f.name)}</b>
      <span class="sub">${fmt(f.kcal)} kcal · P ${fmt(f.p, 1)} · G ${fmt(f.f, 1)} · C ${fmt(f.c, 1)} /100 g</span></span>
      ${f.approx ? '<span class="badge">aprox.</span>' : ''}</button>`).join('');
    if (t) {   // coincidencias del catálogo base que aún no están en tu base
      const idx = catalogMatches(q.value, 10);
      if (idx.length) html += '<span class="sub" style="margin-top:6px">Catálogo base</span>' + idx.map(i => { const c = CATALOG[i];
        return `<button class="item" data-cat="${i}"><span class="grow"><b>${esc(c[0])}</b>
        <span class="sub">${fmt(c[1])} kcal · P ${fmt(c[2], 1)} · G ${fmt(c[3], 1)} · C ${fmt(c[4], 1)} /100 g</span></span><span class="badge">catálogo</span></button>`; }).join('');
    }
    if (!html) html = '<p class="empty">Sin resultados. Crea el alimento, búscalo online o escanea su código.</p>';
    else if (!t) html += `<span class="sub" style="text-align:center;margin-top:6px">Escribe para buscar también en el catálogo base (${CATALOG.length} alimentos)</span>`;
    list.innerHTML = html;
  };
  q.addEventListener('input', draw); draw();
  const again = () => sheetPicker({ title, onPick, onBack });
  list.addEventListener('click', ev => {
    const it = ev.target.closest('.item'); if (!it) return;
    const food = it.dataset.cat !== undefined ? addCatalog(+it.dataset.cat) : foodById(it.dataset.id);
    sheetQty({ food, grams: state.lastGrams[food.id] || (food.unit ? food.unit.g : 100),
               confirmLabel: 'Añadir', onOk: g => onPick(food, g), onBack: again });
  });
  $('#pnew', b).onclick = () => openFoodForm(null, again);
  const afterSave = food => sheetQty({ food, grams: food.unit ? food.unit.g : 100, confirmLabel: 'Añadir', onOk: g => onPick(food, g), onBack: again });
  $('#ponline', b).onclick = () => sheetOnline({ onBack: again, onDone: afterSave });
  $('#pscan', b).onclick = () => sheetScan({ onBack: again, onDone: afterSave });
  $('#pback', b).onclick = () => onBack ? onBack() : closeSheet();
}

      state.meals.forEach(m => { m.items = m.items.filter(i => i.foodId !== food.id); });
      state.recent = state.recent.filter(i => i !== food.id);
      save(); closeSheet(); render(); toast('Alimento eliminado');
    }, () => openFoodForm(food, onSaved));
}

/* ---- Búsqueda online en Open Food Facts (base abierta; requiere conexión) ----
   Los resultados se revisan en el formulario antes de guardarse; una vez guardados
   el alimento vive en tu base local y funciona sin internet. */
const onlineState = { q: '', results: null, msg: '' };
function offToFood(p) {
  const n = p.nutriments || {};
  let kcal = n['energy-kcal_100g'];
  if (kcal == null && n['energy_100g'] != null) kcal = n['energy_100g'] / 4.184;   // kJ → kcal
  const name = (p.product_name_es || p.product_name || '').trim();
  if (!name || kcal == null || !isFinite(+kcal)) return null;
  const brand = (p.brands || '').split(',')[0].trim();
  const missing = ['proteins_100g', 'fat_100g', 'carbohydrates_100g', 'fiber_100g']
    .filter(k => n[k] == null || !isFinite(+n[k]));
  const r1 = x => Math.round(num(x) * 10) / 10, sq = num(p.serving_quantity);
  return {
    name: brand && !norm(name).includes(norm(brand)) ? `${name} (${brand})` : name,
    kcal: Math.round(+kcal), p: r1(n.proteins_100g), f: r1(n.fat_100g), c: r1(n.carbohydrates_100g), fiber: r1(n.fiber_100g),
    approx: missing.length > 0,
    note: 'Fuente: Open Food Facts' + (p.code ? ` (${p.code})` : '') + (missing.length ? '. Faltan datos en su ficha: revisa la etiqueta.' : ''),
    unit: sq > 0 && sq < 1000 ? { name: 'porción', g: sq } : null,
    img: [p.image_front_small_url, p.image_small_url, p.image_thumb_url].find(u => /^https:\/\//.test(u || '')) || ''   // miniatura (solo https)
  };
}
async function searchOFF(q) {
  const url = 'https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=30'
    + '&fields=code,product_name,product_name_es,brands,nutriments,serving_quantity,image_front_small_url,image_small_url,image_thumb_url&search_terms=' + encodeURIComponent(q);
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    return (j.products || []).map(offToFood).filter(Boolean);
  } finally { clearTimeout(timer); }
}
const OFF_FIELDS = 'code,product_name,product_name_es,brands,nutriments,serving_quantity,image_front_small_url,image_small_url,image_thumb_url';
/* Consulta un producto por su código de barras en Open Food Facts → [] o [alimento] */
async function barcodeResults(code) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`, { signal: ctl.signal });
    if (!r.ok && r.status !== 404) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const f = j && j.status === 1 && j.product ? offToFood(Object.assign({ code }, j.product)) : null;
    return f ? [f] : [];
  } finally { clearTimeout(timer); }
}
/* Escáner: usa la cámara y BarcodeDetector (Chrome en Android). Sin cámara, se puede escribir el número. */
function sheetScan({ onDone, onBack, msg }) {
  const canScan = 'BarcodeDetector' in window && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
  const b = openSheet(`<h3>Escanear código de barras</h3>
    ${canScan ? '<video id="sv" playsinline muted style="width:100%;border-radius:12px;background:#000;max-height:40vh;object-fit:cover"></video>' : ''}
    <p class="note" id="sst">${esc(msg || (canScan ? 'Apunta la cámara al código de barras del producto.' : 'Este navegador no puede escanear con la cámara. Escribe el número del código.'))}</p>
    <label class="lbl">O escribe el número del código</label>
    <div class="grid2" style="grid-template-columns:1fr auto"><input id="sc" inputmode="numeric" placeholder="8412345678901" autocomplete="off"><button class="btn primary" id="sgo">Buscar</button></div>
    <button class="btn block" id="sback">${onBack ? 'Volver' : 'Cerrar'}</button>`);
  let stream = null, stop = false;
  const status = t => { const s = $('#sst'); if (s) s.textContent = t; };
  const stopCam = () => { stop = true; if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } };
  sheetCleanup = stopCam;    // la cámara se apaga al cerrar o cambiar de pantalla
  const again = m => sheetScan({ onDone, onBack, msg: m });
  const found = async code => {
    stopCam();
    if (!navigator.onLine) return again('Sin conexión. Inténtalo cuando tengas internet.');
    status('Buscando ' + code + '…');
    let res;
    try { res = await barcodeResults(code); } catch (e) { return again('No se pudo conectar con Open Food Facts. Inténtalo de nuevo.'); }
    if (!res.length) return again(`No hay datos útiles del código ${code}. Prueba con otro o crea el alimento a mano.`);
    openFoodForm(null, saved => saved ? onDone(saved) : sheetScan({ onDone, onBack }), res[0]);
  };
  $('#sgo', b).onclick = () => {
    const c = $('#sc', b).value.replace(/\D/g, '');
    if (c.length < 8 || c.length > 14) return toast('El código tiene entre 8 y 14 cifras');
    found(c);
  };
  $('#sback', b).onclick = () => onBack ? onBack() : closeSheet();
  if (canScan) (async () => {
    try {
      const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      if (stop) { stopCam(); return; }
      const v = $('#sv'); if (!v) { stopCam(); return; }
      v.srcObject = stream; await v.play();
      const tick = async () => {
        if (stop) return;
        try { const r = await det.detect(v); if (r.length) return found(r[0].rawValue); } catch (e) {}
        setTimeout(tick, 250);
      };
      tick();
    } catch (e) { status('No se pudo usar la cámara' + (e && e.name === 'NotAllowedError' ? ' (permiso denegado)' : '') + '. Escribe el código.'); }
  })();
}
function sheetOnline({ onDone, onBack }) {
  const b = openSheet(`<h3>Buscar online</h3>
    <span class="sub">Open Food Facts · productos de supermercado. Revisa los datos antes de guardar.</span>
    <div class="grid2" style="grid-template-columns:1fr auto;margin-top:10px">
      <input type="search" id="oq" placeholder="Ej.: arroz basmati hacendado" value="${esc(onlineState.q)}" autocomplete="off">
      <button class="btn primary" id="ogo">Buscar</button></div>
    <button class="btn sm block" id="oscan" style="margin-top:8px">📷 Escanear código de barras</button>
    <div id="olist" class="list" style="max-height:50vh"></div>
    <button class="btn block" id="oback">${onBack ? 'Volver' : 'Cerrar'}</button>`);
  const list = $('#olist', b), q = $('#oq', b);
  const draw = () => {
    if (onlineState.msg) { list.innerHTML = `<p class="empty">${esc(onlineState.msg)}</p>`; return; }
    const res = onlineState.results;
    if (!res) { list.innerHTML = ''; return; }
    list.innerHTML = res.length ? res.map((f, i) => `<button class="item" data-i="${i}">${f.img ? `<img class="thumb" src="${esc(f.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}<span class="grow"><b>${esc(f.name)}</b>
      <span class="sub">${fmt(f.kcal)} kcal · P ${fmt(f.p, 1)} · G ${fmt(f.f, 1)} · C ${fmt(f.c, 1)} /100 g</span></span>
      ${f.approx ? '<span class="badge">incompleto</span>' : ''}</button>`).join('')
      : '<p class="empty">Sin resultados. Prueba con otras palabras (por ejemplo, la marca).</p>';
  };
  const go = async () => {
    const t = q.value.trim();
    if (t.length < 2) return toast('Escribe al menos 2 letras');
    onlineState.q = t; onlineState.msg = '';
    if (!navigator.onLine) { onlineState.results = null; onlineState.msg = 'Sin conexión. Inténtalo cuando tengas internet.'; draw(); return; }
    list.innerHTML = '<p class="empty">Buscando…</p>';
    try { onlineState.results = /^\d{8,14}$/.test(t) ? await barcodeResults(t) : await searchOFF(t); }   // un número largo = código de barras
    catch (e) { onlineState.results = null; onlineState.msg = 'No se pudo conectar con Open Food Facts. Inténtalo de nuevo en unos segundos.'; }
    if (list.isConnected) draw();
  };
  $('#ogo', b).onclick = go;
  $('#oscan', b).onclick = () => sheetScan({ onDone, onBack: () => sheetOnline({ onDone, onBack }) });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  list.addEventListener('click', ev => {
    const it = ev.target.closest('.item'); if (!it) return;
    const pre = onlineState.results[+it.dataset.i];
    openFoodForm(null, saved => saved ? onDone(saved) : sheetOnline({ onDone, onBack }), pre);
  });
  $('#oback', b).onclick = () => onBack ? onBack() : closeSheet();
  draw();
}

/* Actividad extra del día (fútbol, pádel, caminar…): kcal netas = (MET − 1) × peso del día × horas,

function sheetActivity(act) {
  const key = ui.date, isNew = !act;
  const a = act || { id: null, name: 'Fútbol', min: 60, met: 7, kcalManual: 0, speed: 0 };
  let type = a.speed > 0 ? 'walk' : (SPORTS.some(s => s[0] === a.name) ? a.name : 'custom');
  if (isNew) type = 'Fútbol';
  const b = openSheet(`<h3>${isNew ? 'Añadir actividad' : 'Editar actividad'}</h3>
    <span class="sub">${esc(dateLabel(key))}</span>
    <label class="lbl">Actividad</label>
    <select id="at">${SPORTS.map(([n, m]) => `<option value="${esc(n)}" ${type === n ? 'selected' : ''}>${esc(n)} (MET ${plain(m)})</option>`).join('')}
      <option value="walk" ${type === 'walk' ? 'selected' : ''}>Caminar / correr (por velocidad)</option>
      <option value="custom" ${type === 'custom' ? 'selected' : ''}>Otra (indicar nombre y MET)</option></select>
    <div id="wWalk"><label class="lbl">Velocidad (km/h)</label><input id="asp" inputmode="decimal" value="${a.speed > 0 ? plain(a.speed) : '6'}"></div>
    <div id="wCustom" class="grid2"><div><label class="lbl">Nombre</label><input id="an" value="${esc(type === 'custom' ? a.name : '')}"></div>
      <div><label class="lbl">MET</label><input id="amet" inputmode="decimal" value="${plain(a.met || 5)}"></div></div>
    <label class="lbl">Duración (min)</label><input id="am" inputmode="decimal" value="${plain(a.min)}">
    <label class="lbl">kcal de tu reloj (opcional, sustituye al cálculo)</label>
    <input id="ak" inputmode="decimal" value="${num(a.kcalManual) > 0 ? plain(a.kcalManual) : ''}" placeholder="vacío = calcular">
    <div class="preview" id="ap"></div>
    <button class="btn primary block" id="aok">Guardar</button>
    <div class="row2"><button class="btn" id="cl">Cancelar</button>${isNew ? '<span></span>' : '<button class="btn danger" id="adel">Eliminar</button>'}</div>`);
  const sel = $('#at', b);
  const metNow = () => {
    const t = sel.value;
    if (t === 'walk') return metWalk(num($('#asp', b).value));
    if (t === 'custom') return num($('#amet', b).value);
    return SPORTS.find(s => s[0] === t)[1];
  };
  const calc = () => { const man = num($('#ak', b).value); return man > 0 ? man : netKcal(metNow(), weightAt(key), num($('#am', b).value)); };
  const upd = () => {
    $('#wWalk', b).style.display = sel.value === 'walk' ? '' : 'none';
    $('#wCustom', b).style.display = sel.value === 'custom' ? '' : 'none';
    const man = num($('#ak', b).value) > 0;
    $('#ap', b).innerHTML = `<b>≈ ${fmt(calc())} kcal</b>${man ? ' (valor de tu reloj)' : ` · MET ${fmt(metNow(), 1)} · peso ${fmt(weightAt(key), 1)} kg`}`;
  };
  b.addEventListener('input', upd); b.addEventListener('change', upd); upd();
  $('#cl', b).onclick = closeSheet;
  $('#aok', b).onclick = () => {
    const min = num($('#am', b).value);
    if (!(min > 0)) return toast('Indica la duración');
    const t = sel.value; let name = t, speed = 0;
    if (t === 'walk') { speed = num($('#asp', b).value); if (!(speed > 0)) return toast('Indica la velocidad'); name = `Caminar/correr a ${plain(speed)} km/h`; }
    else if (t === 'custom') { name = $('#an', b).value.trim() || 'Actividad'; if (!(metNow() > 0)) return toast('Indica el MET'); }
    const obj = { id: a.id || uid(), name, min, met: metNow(), kcalManual: num($('#ak', b).value), speed };
    const d = ensureDay(key); d.activities = d.activities || [];
    const i = d.activities.findIndex(x => x.id === obj.id);
    if (i >= 0) d.activities[i] = obj; else d.activities.push(obj);
    save(); closeSheet(); render(); toast('Actividad guardada');
  };
  if (!isNew) $('#adel', b).onclick = () => {
    const d = ensureDay(key); d.activities = d.activities.filter(x => x.id !== a.id); save(); closeSheet(); render();
  };
}

/* Gráfica de peso en SVG, sin librerías */
function weightChartSVG(pts) {
  if (!pts.length) return '<p class="empty">Aún no hay pesos en este periodo.</p>';
  const W = 360, H = 200, L = 40, R = 14, T = 16, B = 26;
  const xs = pts.map(p => parseKey(p.date).getTime()), ys = pts.map(p => p.kg);
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x0 === x1) { x0 -= 864e5 * 3; x1 += 864e5 * 3; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = Math.max(0.5, (y1 - y0) * 0.2);
  y0 = Math.floor((y0 - pad) * 2) / 2; y1 = Math.ceil((y1 + pad) * 2) / 2; if (y1 - y0 < 1) y1 = y0 + 1;
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = y0 + (y1 - y0) * i / 4, y = Y(v).toFixed(1);
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${(+y + 3).toFixed(1)}" text-anchor="end">${fmt(v, 1)}</text>`;
  }
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(xs[i]).toFixed(1)} ${Y(ys[i]).toFixed(1)}`).join('');
  const dots = pts.map((p, i) => `<circle class="dot" cx="${X(xs[i]).toFixed(1)}" cy="${Y(ys[i]).toFixed(1)}" r="${pts.length > 40 ? 2 : 3.5}"/>`).join('');
  const short = k => { const d = parseKey(k); return `${d.getDate()}/${d.getMonth() + 1}`; };
  const lastX = X(xs[xs.length - 1]), lastY = Y(ys[ys.length - 1]);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica de evolución del peso">${g}
    <path class="line" d="${path}"/>${dots}
    <text class="last" x="${Math.min(lastX, W - 24).toFixed(1)}" y="${(lastY - 9).toFixed(1)}" text-anchor="middle">${fmt(ys[ys.length - 1], 1)}</text>
    <text x="${L}" y="${H - 6}" text-anchor="start">${short(pts[0].date)}</text>
    <text x="${W - R}" y="${H - 6}" text-anchor="end">${short(pts[pts.length - 1].date)}</text></svg>`;
}
